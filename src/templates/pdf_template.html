<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mailer Sequence Order Proof</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .proof-container {
            width: 800px;
            background-color: #ffffff;
            border: 2px solid #000000;
            padding: 24px;
            color: #000000;
        }

        /* Header Section */
        .header-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .header-table td {
            vertical-align: top;
        }

        .logo-section {
            width: 25%;
        }

        .logo-box {
            display: inline-block;
            text-align: center;
            font-weight: bold;
        }

        .logo-mp {
            font-size: 32px;
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo-express {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            display: block;
        }

        .title-section {
            width: 50%;
            text-align: center;
        }

        .main-title {
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .instructions {
            font-size: 11px;
            line-height: 1.3;
        }

        /* Job Info Section & Dynamic Inputs */
        .job-info-section {
            width: 25%;
            text-align: right;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.6;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-bottom: 4px;
        }

        .input-group label {
            white-space: nowrap;
        }

        .job-input {
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
            width: 110px;
            color: #000000;
        }

        .job-input:focus {
            outline: none;
            border-color: #000000;
            background-color: #f9f9f9;
        }

        /* Approval Box Section */
        .approval-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000000;
            margin-bottom: 24px;
            font-size: 12px;
        }

        .approval-table th {
            border: 1px solid #000000;
            padding: 6px;
            text-align: left;
            font-weight: bold;
            background-color: #f0f0f0;
        }

        .approval-table td {
            border: 1px solid #000000;
            padding: 8px;
            vertical-align: middle;
        }

        .checkbox-cell {
            width: 30%;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-square {
            width: 14px;
            height: 14px;
            border: 1px solid #000000;
            display: inline-block;
        }

        .input-cell {
            width: 35%;
        }

        .line-prompt {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .underline {
            flex-grow: 1;
            border-bottom: 1px solid #000000;
            height: 14px;
        }

        /* Content Views Area */
        .views-grid {
            display: flex;
            gap: 20px;
        }

        .view-column {
            flex: 1;
        }

        .view-header {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            padding-bottom: 6px;
            border-bottom: 2px solid #000000;
            margin-bottom: 12px;
        }

        /* Specified View Containers */
        .view-container-3d {
            background-color: #00aeef; /* Cyan */
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .view-container-2d {
            background-color: #ec008c; /* Magenta */
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .view-container-3d img,
        .view-container-2d img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Print/PDF Export Styles to clean up inputs */
        @media print {
            body {
                background-color: #ffffff;
                padding: 0;
            }
            .job-input {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                width: auto !important;
            }
        }
    </style>
</head>
<body>

    <div class="proof-container">
        <!-- Header -->
        <table class="header-table">
            <tr>
                <td class="logo-section">
                    <div class="logo-box">
                        <div class="logo-mp">mp</div>
                        <span class="logo-express">EXPRESS</span>
                    </div>
                </td>
                <td class="title-section">
                    <h1 class="main-title">Mailer Sequence Order</h1>
                    <p class="instructions">
                        Please review the sequence order proof carefully<br>
                        and reply with changes or approval via email.
                    </p>
                </td>
                <td class="job-info-section">
                    <div class="input-group">
                        <label for="attn-input">Attn:</label>
                        <input type="text" id="attn-input" class="job-input" placeholder="Enter Name" value="11111">
                    </div>
                    <div class="input-group">
                        <label for="job-input">Job #</label>
                        <input type="text" id="job-input" class="job-input" placeholder="Enter Job #" value="22222">
                    </div>
                </td>
            </tr>
        </table>

        <!-- Approval Box -->
        <table class="approval-table">
            <thead>
                <tr>
                    <th class="checkbox-cell">Please Check One:</th>
                    <th class="input-cell">Initials</th>
                    <th class="input-cell">Date</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="checkbox-cell">
                        <div class="checkbox-label">
                            <span class="checkbox-square"></span>
                            <span>Ok as is</span>
                        </div>
                    </td>
                    <td class="input-cell" rowspan="3">
                        <div class="line-prompt">
                            <span>Initials:</span>
                            <span class="underline"></span>
                        </div>
                    </td>
                    <td class="input-cell" rowspan="3">
                        <div class="line-prompt">
                            <span>Date:</span>
                            <span class="underline"></span>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="checkbox-cell">
                        <div class="checkbox-label">
                            <span class="checkbox-square"></span>
                            <span>Ok with changes</span>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="checkbox-cell">
                        <div class="checkbox-label">
                            <span class="checkbox-square"></span>
                            <span>New Proof</span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Proof Content Area -->
        <div class="views-grid">
            <div class="view-column">
                <div class="view-header">Stacked Order View</div>
                <!-- 3D View Container (Cyan: #00aeef) -->
                <div id="container-3d" class="view-container-3d">
                    <!-- 3D Image content injected here -->
                </div>
            </div>
            <div class="view-column">
                <div class="view-header">Sequence Order</div>
                <!-- 2D View Container (Magenta: #ec008c) -->
                <div id="container-2d" class="view-container-2d">
                    <!-- 2D Image content injected here -->
                </div>
            </div>
        </div>
    </div>

</body>
</html>
